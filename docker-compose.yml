version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trimurl_postgres
    environment:
      POSTGRES_DB: trimurl_db
      POSTGRES_USER: trimurl_user
      POSTGRES_PASSWORD: trimurl123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trimurl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimurl_user -d trimurl_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trimurl_backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/trimurl_db
      DATABASE_USER: trimurl_user
      DATABASE_PASSWORD: trimurl123
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trimurl_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trimurl_frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_APP_NAME: TrimUrl
    ports:
      - "5173:5173"
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trimurl_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  trimurl_network:
    driver: bridge
